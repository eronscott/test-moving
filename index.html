<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f6f7fb">
    <title>오늘의 행운 번호 | 로또 번호 생성기</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        color: #20233a;
        background: #f6f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        padding: 48px 20px;
        background:
          radial-gradient(ellipse at 50% 0, rgb(225 226 255 / 70%), transparent 44rem),
          #f6f7fb;
      }

      button,
      select {
        font: inherit;
      }

      .app {
        width: min(100%, 720px);
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: #7164d8;
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-align: center;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 7vw, 46px);
        font-weight: 850;
        letter-spacing: -0.07em;
        text-align: center;
      }

      .intro {
        margin: 14px 0 32px;
        color: #72758a;
        font-size: 15px;
        line-height: 1.7;
        text-align: center;
      }

      .panel {
        padding: clamp(20px, 5vw, 36px);
        border: 1px solid #fff;
        border-radius: 24px;
        background: rgb(255 255 255 / 88%);
        box-shadow: 0 18px 60px rgb(54 55 95 / 9%);
      }

      .controls {
        display: flex;
        align-items: end;
        justify-content: space-between;
        gap: 16px;
      }

      .count-control label {
        display: block;
        margin-bottom: 8px;
        color: #77798d;
        font-size: 12px;
        font-weight: 700;
      }

      select {
        min-height: 48px;
        padding: 0 38px 0 14px;
        border: 1px solid #e6e7ef;
        border-radius: 12px;
        color: #292b42;
        background-color: #fff;
        cursor: pointer;
      }

      button {
        min-height: 48px;
        border: 0;
        border-radius: 12px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 160ms ease, box-shadow 160ms ease, background 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #a9a0ff;
        outline-offset: 3px;
      }

      .generate-button {
        flex: 1;
        max-width: 260px;
        color: #fff;
        background: #6b5ce7;
        box-shadow: 0 8px 18px rgb(107 92 231 / 22%);
      }

      .generate-button:hover {
        background: #5d4ed6;
        box-shadow: 0 10px 22px rgb(107 92 231 / 30%);
      }

      .results-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 32px 0 14px;
      }

      .results-header h2 {
        margin: 0;
        font-size: 17px;
        letter-spacing: -0.04em;
      }

      .copy-button {
        min-height: 38px;
        padding: 0 13px;
        border: 1px solid #e9e9f1;
        color: #5f5b7d;
        background: #fff;
        font-size: 12px;
      }

      .copy-button:disabled {
        color: #a7a8b5;
        background: #f6f6f9;
        cursor: not-allowed;
        transform: none;
      }

      .tickets {
        display: grid;
        gap: 10px;
      }

      .ticket {
        display: flex;
        min-height: 76px;
        align-items: center;
        gap: clamp(6px, 2.5vw, 14px);
        padding: 14px clamp(12px, 3vw, 20px);
        border: 1px solid #f0f0f5;
        border-radius: 16px;
        background: #fff;
        animation: appear 280ms both;
      }

      .ticket-label {
        flex: 0 0 34px;
        color: #a0a1af;
        font-size: 11px;
        font-weight: 800;
      }

      .numbers {
        display: flex;
        flex: 1;
        justify-content: space-between;
        gap: 5px;
      }

      .ball {
        display: grid;
        width: clamp(34px, 9vw, 46px);
        height: clamp(34px, 9vw, 46px);
        flex: 0 0 auto;
        place-items: center;
        border-radius: 50%;
        color: #fff;
        font-size: clamp(13px, 3.5vw, 16px);
        font-weight: 800;
        box-shadow: inset 0 -2px 0 rgb(0 0 0 / 9%);
      }

      .ball-1 { color: #594900; background: #ffd84d; }
      .ball-2 { background: #4a9cf5; }
      .ball-3 { background: #f16d69; }
      .ball-4 { background: #9699a5; }
      .ball-5 { background: #71bd76; }

      .empty-state {
        padding: 35px 16px;
        border: 1px dashed #e2e2ed;
        border-radius: 16px;
        color: #9293a3;
        font-size: 14px;
        text-align: center;
      }

      .message {
        min-height: 20px;
        margin: 12px 0 0;
        color: #7164d8;
        font-size: 12px;
        text-align: right;
      }

      .notice {
        margin: 22px 0 0;
        color: #a0a1af;
        font-size: 11px;
        line-height: 1.6;
        text-align: center;
      }

      @keyframes appear {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 480px) {
        body {
          padding: 34px 14px;
        }

        .controls {
          align-items: stretch;
        }

        select,
        .generate-button {
          width: 100%;
          max-width: none;
        }

        .controls {
          flex-direction: column;
        }

        .ticket-label {
          flex-basis: 27px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <p class="eyebrow">LUCKY NUMBER STUDIO</p>
      <h1>오늘의 행운 번호</h1>
      <p class="intro">가볍게 눌러보는 나만의 로또 번호<br>행운은 어떤 숫자와 함께 찾아올까요?</p>

      <section class="panel" aria-label="로또 번호 생성기">
        <div class="controls">
          <div class="count-control">
            <label for="ticket-count">생성할 게임 수</label>
            <select id="ticket-count">
              <option value="1">1게임</option>
              <option value="3">3게임</option>
              <option value="5" selected>5게임</option>
              <option value="10">10게임</option>
            </select>
          </div>
          <button class="generate-button" id="generate-button" type="button">번호 생성하기 ✨</button>
        </div>

        <div class="results-header">
          <h2>행운 번호</h2>
          <button class="copy-button" id="copy-button" type="button" disabled>번호 복사</button>
        </div>
        <div class="tickets" id="tickets" aria-live="polite" aria-label="생성된 로또 번호">
          <div class="empty-state">버튼을 눌러 행운 번호를 뽑아보세요 🍀</div>
        </div>
        <p class="message" id="message" role="status" aria-live="polite"></p>
        <p class="notice">번호는 무작위로 생성되며 당첨을 보장하지 않습니다. 즐거운 마음으로 참고해 주세요.</p>
      </section>
    </main>

    <script>
      const ticketsElement = document.querySelector("#tickets");
      const countElement = document.querySelector("#ticket-count");
      const generateButton = document.querySelector("#generate-button");
      const copyButton = document.querySelector("#copy-button");
      const messageElement = document.querySelector("#message");
      let generatedTickets = [];

      function randomInteger(max) {
        const range = 0x100000000;
        const limit = Math.floor(range / max) * max;
        const values = new Uint32Array(1);

        do {
          crypto.getRandomValues(values);
        } while (values[0] >= limit);

        return values[0] % max;
      }

      function createTicket() {
        const numbers = Array.from({ length: 45 }, (_, index) => index + 1);

        for (let index = 0; index < 6; index += 1) {
          const swapIndex = index + randomInteger(numbers.length - index);
          [numbers[index], numbers[swapIndex]] = [numbers[swapIndex], numbers[index]];
        }

        return numbers.slice(0, 6).sort((a, b) => a - b);
      }

      function renderTickets() {
        ticketsElement.replaceChildren();

        generatedTickets.forEach((numbers, ticketIndex) => {
          const ticket = document.createElement("article");
          ticket.className = "ticket";
          ticket.style.animationDelay = `${ticketIndex * 45}ms`;
          ticket.setAttribute("aria-label", `${ticketIndex + 1}게임`);

          const label = document.createElement("span");
          label.className = "ticket-label";
          label.textContent = `${String(ticketIndex + 1).padStart(2, "0")}`;

          const numberList = document.createElement("div");
          numberList.className = "numbers";

          numbers.forEach((number) => {
            const ball = document.createElement("span");
            ball.className = `ball ball-${Math.ceil(number / 10)}`;
            ball.textContent = number;
            numberList.append(ball);
          });

          ticket.append(label, numberList);
          ticketsElement.append(ticket);
        });

        copyButton.disabled = generatedTickets.length === 0;
      }

      generateButton.addEventListener("click", () => {
        const ticketCount = Number(countElement.value);
        generatedTickets = Array.from({ length: ticketCount }, createTicket);
        messageElement.textContent = "";
        renderTickets();
      });

      copyButton.addEventListener("click", async () => {
        const text = generatedTickets
          .map((numbers, index) => `${index + 1}게임: ${numbers.join(", ")}`)
          .join("\n");

        try {
          await navigator.clipboard.writeText(text);
          messageElement.textContent = "번호를 클립보드에 복사했어요.";
        } catch (error) {
          messageElement.textContent = "복사할 수 없어요. 브라우저 권한을 확인해 주세요.";
        }
      });
    </script>
  </body>
</html>
